name: Publish Hino

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: npm-publish
    cancel-in-progress: false

jobs:
    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Set up Node for npm OIDC
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Update npm for trusted publishing
              run: npm install --global npm@latest

            - name: Install dependencies
              run: bun install

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun test

            - name: Pack with Bun
              run: |
                  mkdir -p "$RUNNER_TEMP/hino-release"
                  bun pm pack --destination "$RUNNER_TEMP/hino-release"

            - name: Publish with npm OIDC
              run: npm publish "$RUNNER_TEMP"/hino-release/*.tgz --access public
